# =============================================
# CONFIGURACIÓN BÁSICA
# =============================================

# Configuración de archivos e imágenes
filesPath=./archivos

# Tema visual
styleCSS=light.css

# Configuración regional
locale=es

# =============================================
# COMPORTAMIENTO DE LA APLICACIÓN
# =============================================

readOnlyAsLabel=false
i18nWarnings=true
showCountInList=true
maxSizeForTextEditor=200
csvSeparator=;
failOnAnnotationMisuse=true
buttonsForNoImageActions=true
toUpperForStringArgumentsInConditions=true
showFilterByDefaultInList=true
mapFacadeAutoCommit=false

# =============================================
# TEMAS VISUALES
# =============================================

themes=terra.css, light.css, dark.css, black-and-white.css, blue.css

# =============================================
# CONFIGURACIÓN DE EMAIL (OPCIONAL)
# =============================================

#smtpHost=Host
#smtpPort=25
#smtpUserId=user
#smtpUserPassword=password
#smtpHostTrusted=false
#smtpStartTLSEnable=false

# =============================================
# LOGGING
# =============================================

javaLoggingLevel=FINE
#hibernateJavaLoggingLevel=FINEST

# =============================================
# CONFIGURACIÓN DE LISTAS Y COLECCIONES
# =============================================

pageRowCount=20
resizeColumns=true
summationInList=true
customizeList=true
saveAndStayForCollections=true
filterOnChange=true

# =============================================
# CONFIGURACIÓN DE VISTAS
# =============================================

showLabelsForToolBarActions=true
useIconsInsteadOfImages=true
showDefaultActionInBottom=true
flowLayout=false

# =============================================
# SEGURIDAD (OPCIONAL)
# =============================================

#turnOffWebSecurity=false
#unsafeEvalInScripts=false

# =============================================
# AYUDA (OPCIONAL)
# =============================================

#helpAvailable=false
#helpInNewWindow=true
#helpPrefix=help/
#helpSuffix=.html
# Forzar recarga de recursos estáticos
resourceModificationCheckingInterval=1